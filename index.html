
<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SNV Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      font-family: Arial, sans-serif;
      background: #10131e; color: #fff;
    }
    .container { max-width: 650px; margin: auto; }
    h1 { text-align: center; color: #a9a5ff; }
    .card {
      background: #1c2030; border: 1px solid #34394f;
      border-radius: 12px; padding: 16px; margin: 14px 0;
    }
    input, textarea, button {
      width: 100%; padding: 12px; margin: 7px 0;
      border-radius: 8px; border: 1px solid #414760;
      font-size: 16px;
    }
    input, textarea {
      background: #10131e; color: white;
    }
    button {
      background: #6258e8; color: white;
      border: 0; font-weight: bold;
    }
    button.secondary { background: #34394f; }
    button.danger { background: #a9344a; }
    .hidden { display: none; }
    .status { white-space: pre-wrap; color: #d7d5ff; }
    .product {
      border: 1px solid #414760; border-radius: 10px;
      padding: 12px; margin: 12px 0;
    }
    .product img {
      width: 100%; max-height: 220px;
      object-fit: contain; background: #10131e;
      border-radius: 8px;
    }
    .small { color: #b8bfd2; font-size: 13px; }
    label { display: block; margin-top: 10px; }
  </style>
</head>
<body>
<div class="container">
  <h1>SNV GAME TOP-UP</h1>
  <p style="text-align:center">ADMIN PANEL</p>

  <div id="loginBox" class="card">
    <h2>ចូលគណនី Admin</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="អ៊ីមែល Admin" required>
      <input id="password" type="password" placeholder="ពាក្យសម្ងាត់" required>
      <button type="submit">ចូលគណនី</button>
    </form>
  </div>

  <div id="adminBox" class="hidden">
    <div class="card">
      <h2 id="formTitle">បន្ថែម Package ថ្មី</h2>
      <form id="productForm">
        <input id="productName" placeholder="ឈ្មោះ Package" required>
        <input id="productPrice" type="number" min="0.01"
          step="0.01" placeholder="តម្លៃ USD" required>
        <textarea id="description" placeholder="ព័ត៌មាន Package (មិនចាំបាច់)"></textarea>

        <label>រូបភាព Package ថ្មី</label>
        <input id="imageFile" type="file" accept="image/*">
        <p class="small">អាចជ្រើសរូបភាពថ្មី ឬទុកទទេពេលកែ Package ដែលមានស្រាប់។</p>

        <label>
          <input id="active" type="checkbox" checked
            style="width:auto; margin-right:8px">
          បង្ហាញ Package នៅលើវេបសាយ
        </label>

        <button type="submit" id="saveButton">រក្សាទុក Package</button>
        <button type="button" id="cancelButton" class="secondary hidden">
          បោះបង់ការកែប្រែ
        </button>
      </form>
      <p id="status" class="status"></p>
    </div>

    <div class="card">
      <h2>បញ្ជី Package</h2>
      <button id="refreshButton" class="secondary">ផ្ទុកបញ្ជីឡើងវិញ</button>
      <div id="productList">កំពុងផ្ទុក...</div>
    </div>

    <button id="logoutButton" class="danger">ចាកចេញ</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = "https://ckqfewtvpirmxcanmyiu.supabase.co";

  // ប្រើ Publishable Key ដូចគ្នានឹង index.html របស់អ្នក។
  const SUPABASE_KEY = "sb_publishable_IIlUeTGAGTgv1FoAoruWKQ_vRgxMCth";

  const client = window.supabase.createClient(
    SUPABASE_URL, SUPABASE_KEY
  );

  const $ = id => document.getElementById(id);
  let editingId = null;
  let currentImagePath = null;

  function message(text) {
    $("status").textContent = text;
  }

  function showLogin() {
    $("loginBox").classList.remove("hidden");
    $("adminBox").classList.add("hidden");
  }

  function showAdmin() {
    $("loginBox").classList.add("hidden");
    $("adminBox").classList.remove("hidden");
  }

  async function checkAdmin() {
    const { data: sessionData } = await client.auth.getSession();
    if (!sessionData.session) {
      showLogin();
      return;
    }

    const { data, error } = await client.rpc("is_snv_admin");

    if (error || data !== true) {
      await client.auth.signOut();
      showLogin();
      alert("គណនីនេះមិនមានសិទ្ធិ Admin ទេ។ សូមពិនិត្យការកំណត់សិទ្ធិ។");
      return;
    }

    showAdmin();
    await loadProducts();
  }

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();

    const { error } = await client.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });

    if (error) {
      alert("ចូលមិនបាន៖ " + error.message);
      return;
    }

    await checkAdmin();
  });

  async function uploadImage(file) {
    const safeName = file.name
      .normalize("NFKD")
      .replace(/[^a-zA-Z0-9._-]/g, "_");

    const path = "products/" + Date.now() + "_" + safeName;

    const { error } = await client.storage
      .from("package-images")
      .upload(path, file, {
        upsert: false,
        contentType: file.type || "application/octet-stream"
      });

    if (error) throw error;

    const { data } = client.storage
      .from("package-images")
      .getPublicUrl(path);

    return { path, url: data.publicUrl };
  }

  $("productForm").addEventListener("submit", async event => {
    event.preventDefault();
    message("កំពុងរក្សាទុក...");

    try {
      const name = $("productName").value.trim();
      const price = Number($("productPrice").value);
      const file = $("imageFile").files[0];

      if (!name || !Number.isFinite(price) || price <= 0) {
        throw new Error("សូមបញ្ចូលឈ្មោះ និងតម្លៃត្រឹមត្រូវ។");
      }

      let imagePath = currentImagePath;
      let imageUrl = null;

      if (file) {
        const uploaded = await uploadImage(file);
        imagePath = uploaded.path;
        imageUrl = uploaded.url;
      }

      const product = {
        name,
        price,
        description: $("description").value.trim() || null,
        is_active: $("active").checked,
        updated_at: new Date().toISOString()
      };

      if (imagePath) product.image_path = imagePath;
      if (imageUrl) product.image_url = imageUrl;

      let result;

      if (editingId !== null) {
        result = await client.from("products")
          .update(product)
          .eq("id", editingId);
      } else {
        if (!imagePath) {
          throw new Error("សូមជ្រើសរើសរូបភាព Package។");
        }
        product.is_sold = false;
        product.reserved_order_code = null;
        product.reserved_until = null;

        result = await client.from("products").insert(product);
      }

      if (result.error) throw result.error;

      message("រក្សាទុកបានជោគជ័យ!");
      resetForm();
      await loadProducts();
    } catch (error) {
      message("មានបញ្ហា៖ " + error.message);
    }
  });

  function resetForm() {
    editingId = null;
    currentImagePath = null;
    $("productForm").reset();
    $("active").checked = true;
    $("formTitle").textContent = "បន្ថែម Package ថ្មី";
    $("saveButton").textContent = "រក្សាទុក Package";
    $("cancelButton").classList.add("hidden");
    $("imageFile").value = "";
  }

  $("cancelButton").addEventListener("click", () => {
    resetForm();
    message("");
  });

  async function loadProducts() {
    $("productList").textContent = "កំពុងផ្ទុក...";
    const { data, error } = await client.from("products")
      .select("*")
      .order("id", { ascending: false });

    if (error) {
      $("productList").textContent = "មិនអាចផ្ទុកបាន៖ " + error.message;
      return;
    }

    $("productList").replaceChildren();

    if (!data || data.length === 0) {
      $("productList").textContent = "មិនទាន់មាន Package ទេ។";
      return;
    }

    data.forEach(product => {
      const card = document.createElement("div");
      card.className = "product";

      const title = document.createElement("h3");
      title.textContent = product.name;

      const price = document.createElement("p");
      price.textContent = "តម្លៃ៖ $" + Number(product.price).toFixed(2);

      const state = document.createElement("p");
      state.textContent =
        (product.is_active ? "សកម្ម" : "បានបិទ") +
        " · " + (product.is_sold ? "បានលក់" : "មិនទាន់លក់");

      card.append(title, price, state);

      if (product.image_url) {
        const img = document.createElement("img");
        img.src = product.image_url;
        img.alt = product.name;
        img.loading = "lazy";
        card.appendChild(img);
      } else if (product.image_path) {
        const { data: publicData } = client.storage
          .from("package-images")
          .getPublicUrl(product.image_path);
        const img = document.createElement("img");
        img.src = publicData.publicUrl;
        img.alt = product.name;
        card.appendChild(img);
      }

      const edit = document.createElement("button");
      edit.textContent = "កែប្រែ";
      edit.addEventListener("click", () => {
        editingId = product.id;
        currentImagePath = product.image_path || null;
        $("productName").value = product.name || "";
        $("productPrice").value = product.price;
        $("description").value = product.description || "";
        $("active").checked = product.is_active;
        $("imageFile").value = "";
        $("formTitle").textContent = "កែប្រែ Package #" + product.id;
        $("saveButton").textContent = "រក្សាទុកការកែប្រែ";
        $("cancelButton").classList.remove("hidden");
        message("បើចង់ប្ដូររូបភាព សូមជ្រើសរូបភាពថ្មី។");
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      const remove = document.createElement("button");
      remove.textContent = "លុប Package";
      remove.className = "danger";
      remove.addEventListener("click", async () => {
        if (!confirm("តើអ្នកប្រាកដថាចង់លុប " + product.name + " មែនទេ?")) {
          return;
        }

        const { error: deleteError } = await client
          .from("products").delete().eq("id", product.id);

        if (deleteError) {
          alert("លុបមិនបាន៖ " + deleteError.message);
          return;
        }

        await loadProducts();
      });

      card.append(edit, remove);
      $("productList").appendChild(card);
    });
  }

  $("refreshButton").addEventListener("click", loadProducts);

  $("logoutButton").addEventListener("click", async () => {
    await client.auth.signOut();
    showLogin();
  });

  client.auth.onAuthStateChange(() => {
    setTimeout(checkAdmin, 0);
  });

  checkAdmin();
})();
</script>
</body>
</html>
