<!DOCTYPE html>  <html lang="km">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1">  
  <title>SNV Supabase Test</title>  
  <style>  
    body {  
      background: #10131e;  
      color: white;  
      font-family: Arial, sans-serif;  
      padding: 16px;  
    }  
    h2 { color: #85f0b1; }  
    button {  
      padding: 12px;  
      width: 100%;  
      background: #536bd7;  
      color: white;  
      border: 0;  
      border-radius: 8px;  
      margin-bottom: 14px;  
    }  
    .item {  
      background: #22283a;  
      padding: 12px;  
      margin: 10px 0;  
      border-radius: 8px;  
      overflow-wrap: anywhere;  
    }  
    pre {  
      white-space: pre-wrap;  
      overflow-wrap: anywhere;  
    }  
  </style>  
</head>  
<body>  
  <h2>SNV Game Top-up</h2>  
  <p>សាកល្បងទាញទិន្នន័យពី shop-packages</p>  
  <button onclick="testTable()">សាកល្បងទាញទិន្នន័យ</button>  
  <div id="status">មិនទាន់សាកល្បងទេ</div>  
  <div id="results"></div>  <script>  
const SUPABASE_URL =  
  "https://ckqfewtvpirmxcanmyiu.supabase.co";  
  
const SUPABASE_KEY =  
  "ដាក់_PUBLISHABLE_KEY_របស់អ្នកនៅទីនេះ";  
  
async function testTable() {  
  const status = document.getElementById("status");  
  const results = document.getElementById("results");  
  
  status.textContent = "កំពុងភ្ជាប់ Supabase...";  
  results.replaceChildren();  
  
  try {  
    const url =  
      SUPABASE_URL +  
      "/rest/v1/shop-packages?select=*&limit=10";  
  
    const response = await fetch(url, {  
      headers: {  
        apikey: SUPABASE_KEY,  
        Authorization: "Bearer " + SUPABASE_KEY  
      },  
      cache: "no-store"  
    });  
  
    const text = await response.text();  
  
    if (!response.ok) {  
      status.textContent =  
        "បរាជ័យ HTTP " + response.status;  
      const error = document.createElement("pre");  
      error.textContent = text;  
      results.appendChild(error);  
      return;  
    }  
  
    const data = JSON.parse(text);  
  
    status.textContent =  
      "ជោគជ័យ! បានទាញទិន្នន័យ " +  
      data.length + " ជួរ។";  
  
    if (data.length === 0) {  
      results.textContent =  
        "តារាងមាន ប៉ុន្តែមិនមានទិន្នន័យ ឬគោលការណ៍ RLS មិនអនុញ្ញាតឱ្យអាន។";  
      return;  
    }  
  
    data.forEach((row, index) => {  
      const item = document.createElement("div");  
      item.className = "item";  
  
      const title = document.createElement("strong");  
      title.textContent = "ទិន្នន័យទី " + (index + 1);  
      item.appendChild(title);  
  
      const pre = document.createElement("pre");  
      pre.textContent = JSON.stringify(row, null, 2);  
      item.appendChild(pre);  
  
      results.appendChild(item);  
    });  
  
  } catch (error) {  
    status.textContent =  
      "មានបញ្ហា៖ " + error.message;  
  }  
}  
</script>  </body>  
</html>
