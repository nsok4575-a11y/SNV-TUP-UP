
<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNV Game Top-up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 12px;
      background: #10131e;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      padding: 22px 12px;
      margin-bottom: 22px;
      text-align: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #29285c, #10131e);
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      color: #c8cbe0;
      font-size: 14px;
      margin: 10px 0 0;
    }

    h2 {
      font-size: 19px;
      margin-bottom: 8px;
    }

    #productStatus {
      color: #c8cbe0;
      font-size: 14px;
      text-align: center;
      margin: 16px 0;
      line-height: 1.7;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .product-card {
      min-width: 0;
      padding: 10px;
      background: #22283a;
      color: #ffffff;
      border: 2px solid #343b55;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
    }

    .product-card.selected {
      border-color: #6c8cff;
      outline: 1px solid #6c8cff;
    }

    .product-card:focus-visible {
      outline: 2px solid #85f0b1;
    }

    .product-card img {
      display: block;
      width: 100%;
      height: 135px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 8px;
    }

    .image-placeholder {
      width: 100%;
      height: 135px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      color: #555555;
      background: #ffffff;
      border-radius: 8px;
      font-size: 13px;
    }

    .product-name {
      margin-top: 10px;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .product-price {
      margin-top: 8px;
      color: #85f0b1;
      font-size: 19px;
      font-weight: bold;
    }

    .selected-info {
      margin-top: 22px;
      padding: 16px;
      background: #1b2030;
      border-radius: 12px;
    }

    .selected-info label {
      display: block;
      font-size: 15px;
      margin-bottom: 8px;
    }

    #bankAccountName {
      width: 100%;
      padding: 12px;
      border: 1px solid #454d68;
      border-radius: 8px;
      background: #10131e;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }

    #bankAccountName:focus {
      border-color: #6c8cff;
    }

    #bankAccountName::placeholder {
      color: #9299b2;
    }

    .refresh-button {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #343e69;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
    }

    .refresh-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .note {
      margin-top: 18px;
      color: #aeb4cc;
      font-size: 12px;
      text-align: center;
      line-height: 1.7;
    }

    @media (max-width: 360px) {
      .products-grid {
        gap: 8px;
      }

      .product-card {
        padding: 7px;
      }

      .product-card img,
      .image-placeholder {
        height: 110px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>SNV Game Top-up</h1>
      <p class="subtitle">
        ជ្រើសរើសកញ្ចប់ដែលអ្នកចង់បាន
      </p>
    </header>

    <section>
      <h2>ជ្រើសរើសកញ្ចប់</h2>

      <p id="productStatus" role="status" aria-live="polite">
        កំពុងទាញយកកញ្ចប់...
      </p>

      <div id="products" class="products-grid"></div>

      <button id="refreshButton"
              class="refresh-button"
              type="button">
        ផ្ទុកកញ្ចប់ឡើងវិញ
      </button>
    </section>

    <section class="selected-info">
      <label for="bankAccountName">
        ឈ្មោះគណនីធនាគារសម្រាប់ការទូទាត់
      </label>

      <input
        id="bankAccountName"
        type="text"
        placeholder="បញ្ចូលឈ្មោះគណនីធនាគាររបស់អ្នក"
        autocomplete="name"
        maxlength="100"
      >
    </section>

    <p class="note">
      សូមជ្រើសរើសកញ្ចប់ និងបញ្ចូលឈ្មោះគណនីធនាគារឱ្យបានត្រឹមត្រូវ។
    </p>

  </div>

  <script>
    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
      "https://ckqfewtvpirmxcanmyiu.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_IIlUeTGAGTgv1FoAoruWKQ_vRgxMCth";

    const PRODUCTS_URL =
      SUPABASE_URL +
      "/rest/v1/products?select=*";

    const IMAGE_FUNCTION_URL =
      SUPABASE_URL +
      "/functions/v1/package-image";

    let products = [];
    let selectedProductId = null;
    let isLoadingProducts = false;

    const grid = document.getElementById("products");
    const status = document.getElementById("productStatus");
    const refreshButton =
      document.getElementById("refreshButton");

    // ==========================================
    // LOAD PRODUCTS FROM SUPABASE
    // ==========================================

    async function loadProducts() {
      if (isLoadingProducts) return;

      isLoadingProducts = true;
      refreshButton.disabled = true;
      refreshButton.textContent = "កំពុងទាញយក...";

      status.textContent = "កំពុងទាញយកកញ្ចប់...";

      try {
        const response = await fetch(PRODUCTS_URL, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Accept": "application/json"
          },
          cache: "no-store"
        });

        if (!response.ok) {
          const errorText = await response.text();

          console.error(
            "Supabase error:",
            response.status,
            errorText
          );

          throw new Error(
            "HTTP " + response.status +
            " - " + getErrorMessage(response.status)
          );
        }

        const result = await response.json();

        if (!Array.isArray(result)) {
          throw new Error("ទិន្នន័យមិនត្រឹមត្រូវ។");
        }

        // បង្ហាញតែកញ្ចប់ដែលមានតម្លៃត្រឹមត្រូវ
        const newProducts = result
          .filter(item => {
            if (item.is_sold === true) return false;
            if (item.is_active === false) return false;

            // មិនបង្ហាញបើ price ទទេ ឬ null
            if (
              item.price === null ||
              item.price === undefined ||
              String(item.price).trim() === ""
            ) {
              return false;
            }

            const price = Number(item.price);

            // មិនបង្ហាញបើតម្លៃមិនមែនជាលេខ
            // ឬតម្លៃស្មើសូន្យ/តិចជាងសូន្យ
            if (!Number.isFinite(price) || price <= 0) {
              return false;
            }

            return true;
          })
          .map(item => ({
            id: item.id,
            name: item.name || item.title || "",
            price: Number(item.price),
            image: item.image_url || item.image || ""
          }))
          .filter(item =>
            item.id !== null &&
            item.id !== undefined
          );

        const oldSelection = selectedProductId;

        products = newProducts;

        const selectionExists = products.some(
          item => String(item.id) === String(oldSelection)
        );

        if (!selectionExists) {
          selectedProductId = products.length
            ? products[0].id
            : null;
        }

        renderProducts();

        // មិនបង្ហាញចំនួនកញ្ចប់នៅពេលជោគជ័យ
        status.textContent = "";

      } catch (error) {
        console.error("Failed to load products:", error);

        if (products.length === 0) {
          grid.replaceChildren();

          status.textContent =
            "មិនអាចទាញយកកញ្ចប់បានទេ។ " +
            (error.message || "សូមពិនិត្យការតភ្ជាប់។");
        } else {
          status.textContent =
            "មិនអាចធ្វើបច្ចុប្បន្នភាពបានទេ។";
        }

      } finally {
        isLoadingProducts = false;
        refreshButton.disabled = false;
        refreshButton.textContent =
          "ផ្ទុកកញ្ចប់ឡើងវិញ";
      }
    }

    // ==========================================
    // IMAGE URL
    // ==========================================

    async function getImageUrl(imagePath) {
      if (!imagePath) return "";

      const value = String(imagePath).trim();

      if (!value) return "";

      // បើជាតំណពេញ ប្រើវាដោយផ្ទាល់
      if (/^https?:\/\//i.test(value)) {
        return value;
      }

      // បើជាផ្លូវក្នុង Storage ស្នើ Signed URL
      try {
        const url =
          IMAGE_FUNCTION_URL +
          "?path=" + encodeURIComponent(value);

        const response = await fetch(url, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Accept": "application/json"
          },
          cache: "no-store"
        });

        if (!response.ok) {
          console.error(
            "Image function error:",
            response.status,
            await response.text()
          );
          return "";
        }

        const data = await response.json();

        // គាំទ្រទម្រង់ JSON ជាច្រើន
        const signedUrl =
          typeof data === "string"
            ? data
            : (
                data.signedUrl ||
                data.signed_url ||
                data.url ||
                data.signedURL ||
                ""
              );

        if (
          typeof signedUrl === "string" &&
          /^https?:\/\//i.test(signedUrl)
        ) {
          return signedUrl;
        }

        console.error(
          "Signed image URL not found:",
          data
        );

        return "";

      } catch (error) {
        console.error("Could not load image URL:", error);
        return "";
      }
    }

    // ==========================================
    // ERROR MESSAGES
    // ==========================================

    function getErrorMessage(statusCode) {
      if (statusCode === 400) {
        return "សូមពិនិត្យតារាង និង Columns។";
      }

      if (statusCode === 401 || statusCode === 403) {
        return "គ្មានសិទ្ធិអានទិន្នន័យ។";
      }

      if (statusCode === 404) {
        return "រកមិនឃើញតារាង ឬ REST endpoint។";
      }

      if (statusCode >= 500) {
        return "មានបញ្ហានៅលើ Supabase Server។";
      }

      return "សូមពិនិត្យអ៊ីនធឺណិត និងការកំណត់ Supabase។";
    }

    // ==========================================
    // DISPLAY PRODUCTS
    // ==========================================

    function renderProducts() {
      grid.replaceChildren();

      if (products.length === 0) {
        status.textContent =
          "មិនទាន់មានកញ្ចប់ដែលបានកំណត់តម្លៃទេ។";
        return;
      }

      products.forEach(product => {
        const card = document.createElement("button");

        card.type = "button";
        card.className = "product-card";

        const isSelected =
          String(product.id) === String(selectedProductId);

        card.setAttribute("aria-pressed", String(isSelected));

        if (isSelected) {
          card.classList.add("selected");
        }

        // រូបភាពកញ្ចប់
        const placeholder = document.createElement("div");
        placeholder.className = "image-placeholder";
        placeholder.textContent = "កំពុងទាញរូបភាព...";
        card.appendChild(placeholder);

        // ទាញ URL រូបភាពដោយឡែក
        if (product.image) {
          getImageUrl(product.image).then(imageUrl => {
            // កុំបន្ថែមរូបភាពទៅកាតដែលត្រូវបានដកចេញ
            if (!card.isConnected) return;

            if (!imageUrl) {
              placeholder.textContent =
                "មិនអាចបង្ហាញរូបភាពបាន";
              return;
            }

            const image = document.createElement("img");
            image.alt = product.name || "រូបភាពកញ្ចប់";
            image.loading = "lazy";
            image.src = imageUrl;

            image.addEventListener("error", () => {
              if (image.isConnected) {
                image.replaceWith(placeholder);
                placeholder.textContent =
                  "មិនអាចបង្ហាញរូបភាពបាន";
              }
            });

            placeholder.replaceWith(image);
          });
        } else {
          placeholder.textContent = "មិនទាន់មានរូបភាព";
        }

        // ឈ្មោះកញ្ចប់
        if (product.name) {
          const name = document.createElement("div");
          name.className = "product-name";
          name.textContent = product.name;
          card.appendChild(name);
        }

        // តម្លៃកញ្ចប់
        const price = document.createElement("div");
        price.className = "product-price";
        price.textContent = "$" + product.price.toFixed(2);
        card.appendChild(price);

        // ជ្រើសរើសកញ្ចប់
        card.addEventListener("click", () => {
          selectedProductId = product.id;
          renderProducts();
        });

        grid.appendChild(card);
      });
    }

    // ==========================================
    // EVENTS
    // ==========================================

    refreshButton.addEventListener("click", loadProducts);

    // ទាញទិន្នន័យពេលបើកទំព័រ
    loadProducts();

    // ធ្វើបច្ចុប្បន្នភាពរៀងរាល់ ៥ នាទី
    setInterval(loadProducts, 5 * 60 * 1000);
  </script>
</body>
</html>
