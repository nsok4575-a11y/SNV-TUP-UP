
<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SNV Game Top-up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 12px;
      background: #10131e;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    header {
      padding: 22px 12px;
      margin-bottom: 22px;
      text-align: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #29285c, #10131e);
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      color: #c8cbe0;
      font-size: 14px;
      margin: 10px 0 0;
    }

    h2 {
      font-size: 19px;
      margin-bottom: 12px;
    }

    #productStatus {
      color: #c8cbe0;
      font-size: 14px;
      text-align: center;
      line-height: 1.7;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .product-card {
      min-width: 0;
      padding: 10px;
      background: #22283a;
      color: #fff;
      border: 2px solid #343b55;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
    }

    .product-card.selected {
      border-color: #6c8cff;
      outline: 1px solid #6c8cff;
    }

    .product-card img {
      display: block;
      width: 100%;
      height: 135px;
      object-fit: contain;
      background: #fff;
      border-radius: 8px;
    }

    .image-placeholder {
      width: 100%;
      height: 135px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      color: #555;
      background: #fff;
      border-radius: 8px;
      font-size: 13px;
    }

    .product-name {
      margin-top: 10px;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .product-price {
      margin-top: 8px;
      color: #85f0b1;
      font-size: 19px;
      font-weight: bold;
    }

    .selected-info {
      margin-top: 22px;
      padding: 16px;
      background: #1b2030;
      border-radius: 12px;
    }

    .selected-info label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
    }

    #bankAccountName {
      width: 100%;
      padding: 12px;
      border: 1px solid #454d68;
      border-radius: 8px;
      background: #10131e;
      color: #fff;
      font-size: 16px;
    }

    #bankAccountName::placeholder {
      color: #9299b2;
    }

    .refresh-button {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #343e69;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .refresh-button:disabled {
      opacity: .6;
    }

    .note {
      margin-top: 18px;
      color: #aeb4cc;
      font-size: 12px;
      text-align: center;
      line-height: 1.7;
    }

    @media (max-width: 360px) {
      .products-grid {
        gap: 8px;
      }

      .product-card {
        padding: 7px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>SNV Game Top-up</h1>
      <p class="subtitle">
        ជ្រើសរើសកញ្ចប់ដែលអ្នកចង់បាន
      </p>
    </header>

    <section>
      <h2>ជ្រើសរើសកញ្ចប់</h2>

      <p id="productStatus" role="status" aria-live="polite">
        កំពុងទាញយកកញ្ចប់...
      </p>

      <div id="products" class="products-grid"></div>

      <button id="refreshButton"
              class="refresh-button"
              type="button">
        ផ្ទុកកញ្ចប់ឡើងវិញ
      </button>
    </section>

    <section class="selected-info">
      <label for="bankAccountName">
        ឈ្មោះគណនីធនាគារសម្រាប់ការទូទាត់
      </label>

      <input
        id="bankAccountName"
        type="text"
        maxlength="100"
        autocomplete="name"
        placeholder="បញ្ចូលឈ្មោះគណនីធនាគាររបស់អ្នក"
      >
    </section>

    <p class="note">
      សូមពិនិត្យកញ្ចប់ និងតម្លៃមុនពេលបន្ត។
    </p>

  </div>

  <script>
    // =====================================
    // SUPABASE SETTINGS
    // =====================================

    const SUPABASE_URL =
      "https://ckqfewtvpirmxcanmyiu.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_IIlUeTGAGTgv1FoAoruWKQ_vRgxMCth";

    const PRODUCTS_URL =
      SUPABASE_URL + "/rest/v1/products?select=*";

    const IMAGE_FUNCTION_URL =
      SUPABASE_URL + "/functions/v1/package-image";

    const grid = document.getElementById("products");
    const status = document.getElementById("productStatus");
    const refreshButton = document.getElementById("refreshButton");

    let products = [];
    let selectedProductId = null;
    let isLoading = false;
    let loadVersion = 0;

    // =====================================
    // LOAD PRODUCTS
    // =====================================

    async function loadProducts() {
      if (isLoading) return;

      isLoading = true;
      const thisLoad = ++loadVersion;

      refreshButton.disabled = true;
      refreshButton.textContent = "កំពុងទាញយក...";
      status.textContent = "កំពុងទាញយកកញ្ចប់...";

      try {
        const response = await fetch(PRODUCTS_URL, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Accept": "application/json"
          },
          cache: "no-store"
        });

        if (!response.ok) {
          const detail = await response.text();
          console.error("Products API:", response.status, detail);
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("ទិន្នន័យ Products មិនត្រឹមត្រូវ។");
        }

        const newProducts = data
          .filter(item => {
            if (item.is_active === false) return false;
            if (item.is_sold === true) return false;

            if (
              item.price === null ||
              item.price === undefined ||
              String(item.price).trim() === ""
            ) {
              return false;
            }

            const price = Number(item.price);

            // មិនបង្ហាញកញ្ចប់ដែលគ្មានតម្លៃ
            if (!Number.isFinite(price) || price <= 0) {
              return false;
            }

            return item.id !== null &&
                   item.id !== undefined;
          })
          .map(item => ({
            id: item.id,
            name: item.name || item.title || "",
            price: Number(item.price),
            image: item.image_url || item.image || ""
          }));

        if (thisLoad !== loadVersion) return;

        const previousSelection = selectedProductId;
        products = newProducts;

        if (
          !products.some(p =>
            String(p.id) === String(previousSelection)
          )
        ) {
          selectedProductId =
            products.length ? products[0].id : null;
        }

        renderProducts();

        // មិនបង្ហាញចំនួនកញ្ចប់
        status.textContent = "";

      } catch (error) {
        console.error("Load products failed:", error);

        if (thisLoad === loadVersion) {
          status.textContent =
            "មិនអាចទាញយកកញ្ចប់បានទេ។ សូមចុចផ្ទុកឡើងវិញ។";
        }
      } finally {
        isLoading = false;
        refreshButton.disabled = false;
        refreshButton.textContent = "ផ្ទុកកញ្ចប់ឡើងវិញ";
      }
    }

    // =====================================
    // GET IMAGE URL
    // =====================================

    async function getImageUrl(imageValue) {
      if (!imageValue) return "";

      let path = String(imageValue).trim();

      if (!path) return "";

      // បើ DB មាន URL ពេញលេញ សាកល្បងប្រើផ្ទាល់
      if (/^https?:\/\//i.test(path)) {
        return path;
      }

      // កែផ្លូវឱ្យស្អាត
      path = path.replace(/^\/+/, "");

      // បើមានឈ្មោះ bucket នៅខាងមុខ ដកវាចេញ
      if (path.startsWith("package-images/")) {
        path = path.substring("package-images/".length);
      }

      // ស្នើ Signed URL ពី Edge Function
      const endpoint =
        IMAGE_FUNCTION_URL +
        "?path=" + encodeURIComponent(path);

      try {
        const response = await fetch(endpoint, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Accept": "application/json"
          },
          cache: "no-store"
        });

        const textResult = await response.text();

        if (!response.ok) {
          console.error(
            "Image function failed:",
            response.status,
            textResult
          );
          return "";
        }

        let result;

        try {
          result = JSON.parse(textResult);
        } catch (_) {
          result = textResult;
        }

        // គាំទ្រទម្រង់ដែល Edge Function
        // អាចប្រើសម្រាប់តំណរូបភាព
        let url = "";

        if (typeof result === "string") {
          url = result;
        } else if (result && typeof result === "object") {
          url =
            result.signedUrl ||
            result.signed_url ||
            result.signedURL ||
            result.url ||
            result.image_url ||
            result.publicUrl ||
            result.public_url ||
            "";
        }

        if (
          typeof url === "string" &&
          /^https?:\/\//i.test(url.trim())
        ) {
          return url.trim();
        }

        console.error("Unexpected image response:", result);
        return "";

      } catch (error) {
        console.error("Image request failed:", error);
        return "";
      }
    }

    // =====================================
    // RENDER PRODUCTS
    // =====================================

    function renderProducts() {
      grid.replaceChildren();

      if (products.length === 0) {
        status.textContent =
          "មិនទាន់មានកញ្ចប់ដែលបានកំណត់តម្លៃទេ។";
        return;
      }

      status.textContent = "";

      products.forEach(product => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "product-card";

        function updateSelectedStyle() {
          const selected =
            String(product.id) === String(selectedProductId);

          card.classList.toggle("selected", selected);
          card.setAttribute("aria-pressed", String(selected));
        }

        updateSelectedStyle();

        const placeholder = document.createElement("div");
        placeholder.className = "image-placeholder";
        placeholder.textContent = product.image
          ? "កំពុងទាញរូបភាព..."
          : "មិនទាន់មានរូបភាព";

        card.appendChild(placeholder);

        if (product.name) {
          const name = document.createElement("div");
          name.className = "product-name";
          name.textContent = product.name;
          card.appendChild(name);
        }

        const price = document.createElement("div");
        price.className = "product-price";
        price.textContent = "$" + product.price.toFixed(2);
        card.appendChild(price);

        card.addEventListener("click", () => {
          selectedProductId = product.id;

          document.querySelectorAll(".product-card")
            .forEach(element => {
              element.classList.remove("selected");
              element.setAttribute("aria-pressed", "false");
            });

          card.classList.add("selected");
          card.setAttribute("aria-pressed", "true");
        });

        grid.appendChild(card);

        if (product.image) {
          getImageUrl(product.image).then(url => {
            if (!card.isConnected) return;

            if (!url) {
              placeholder.textContent =
                "មិនអាចទាញរូបភាពបាន";
              return;
            }

            const img = document.createElement("img");
            img.alt = product.name || "រូបភាពកញ្ចប់";
            img.loading = "lazy";
            img.src = url;

            img.onerror = () => {
              img.replaceWith(placeholder);
              placeholder.textContent =
                "មិនអាចបង្ហាញរូបភាពបាន";
            };

            img.onload = () => {
              console.log("Image loaded:", product.name);
            };

            placeholder.replaceWith(img);
          });
        }
      });
    }

    // =====================================
    // EVENTS
    // =====================================

    refreshButton.addEventListener("click", loadProducts);

    loadProducts();

    setInterval(loadProducts, 5 * 60 * 1000);
  </script>
</body>
</html>
