<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SNV Game Top-up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 12px;
      background: #10131e;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      padding: 22px 12px;
      margin-bottom: 22px;
      text-align: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #29285c, #10131e);
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      color: #c8cbe0;
      font-size: 14px;
      margin: 10px 0 0;
    }

    h2 {
      font-size: 19px;
      margin-bottom: 12px;
    }

    #productStatus {
      color: #c8cbe0;
      font-size: 14px;
      text-align: center;
      line-height: 1.7;
    }

    /* រៀបចំកញ្ចប់ជាពីរជួរឈរនៅលើទូរសព្ទ */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: stretch;
      gap: 12px;
      width: 100%;
    }

    /* កាតកញ្ចប់ */
    .product-card {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-width: 0;
      width: 100%;
      padding: 10px;
      margin: 0;
      background: #22283a;
      color: #fff;
      border: 2px solid #343b55;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      appearance: none;
      -webkit-appearance: none;
    }

    .product-card.selected {
      border-color: #6c8cff;
      outline: 1px solid #6c8cff;
    }

    /* កំណត់ទំហំ និងទីតាំងរូបភាពឱ្យដូចគ្នា */
    .product-card img {
      display: block;
      width: 100%;
      height: 135px;
      min-height: 135px;
      max-height: 135px;
      object-fit: contain;
      object-position: center;
      background: #fff;
      border-radius: 8px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .image-placeholder {
      width: 100%;
      height: 135px;
      min-height: 135px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      color: #555;
      background: #fff;
      border-radius: 8px;
      font-size: 13px;
      overflow-wrap: anywhere;
      flex-shrink: 0;
    }

    .product-name {
      display: block;
      width: 100%;
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .product-price {
      display: block;
      width: 100%;
      margin-top: auto;
      padding-top: 8px;
      color: #85f0b1;
      font-size: 19px;
      font-weight: bold;
      text-align: center;
    }

    .selected-info {
      margin-top: 22px;
      padding: 16px;
      background: #1b2030;
      border-radius: 12px;
    }

    .selected-info label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
    }

    #bankAccountName {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #454d68;
      border-radius: 8px;
      background: #10131e;
      color: #fff;
      font-size: 16px;
    }

    #bankAccountName::placeholder {
      color: #9299b2;
    }

    .refresh-button {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #343e69;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .refresh-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .note {
      margin-top: 18px;
      color: #aeb4cc;
      font-size: 12px;
      text-align: center;
      line-height: 1.7;
    }

    @media (max-width: 360px) {
      body {
        padding: 14px 8px;
      }

      .products-grid {
        gap: 8px;
      }

      .product-card {
        padding: 7px;
      }

      .product-card img,
      .image-placeholder {
        height: 115px;
        min-height: 115px;
        max-height: 115px;
      }

      .product-name {
        font-size: 14px;
      }

      .product-price {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>SNV Game Top-up</h1>
      <p class="subtitle">
        ជ្រើសរើសកញ្ចប់ដែលអ្នកចង់បាន
      </p>
    </header>

    <section>
      <h2>ជ្រើសរើសកញ្ចប់</h2>

      <p id="productStatus" role="status" aria-live="polite">
        កំពុងទាញយកកញ្ចប់...
      </p>

      <div id="products" class="products-grid"></div>

      <button
        id="refreshButton"
        class="refresh-button"
        type="button"
      >
        ផ្ទុកកញ្ចប់ឡើងវិញ
      </button>
    </section>

    <section class="selected-info">
      <label for="bankAccountName">
        ឈ្មោះគណនីធនាគារសម្រាប់ការទូទាត់
      </label>

      <input
        id="bankAccountName"
        type="text"
        maxlength="100"
        autocomplete="name"
        placeholder="បញ្ចូលឈ្មោះគណនីធនាគាររបស់អ្នក"
      >
    </section>

    <p class="note">
      សូមពិនិត្យកញ្ចប់ និងតម្លៃមុនពេលបន្ត។
    </p>

  </div>

  <script>
    // =====================================
    // SUPABASE SETTINGS
    // =====================================

    const SUPABASE_URL =
      "https://ckqfewtvpirmxcanmyiu.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_IIlUeTGAGTgv1FoAoruWKQ_vRgxMCth";

    const PRODUCTS_URL =
      SUPABASE_URL + "/rest/v1/products?select=*";

    const grid = document.getElementById("products");
    const status = document.getElementById("productStatus");
    const refreshButton = document.getElementById("refreshButton");

    let products = [];
    let selectedProductId = null;
    let isLoading = false;

    // =====================================
    // CONVERT IMAGE PATH TO PUBLIC URL
    // =====================================

    function getImageUrl(imageValue) {
      if (!imageValue) return "";

      let path = String(imageValue).trim();

      if (!path) return "";

      // ប្រសិនបើជា URL ពេញលេញ ប្រើ URL ដើម
      if (/^https?:\/\//i.test(path)) {
        return path;
      }

      // ដកសញ្ញា / នៅដើម
      path = path.replace(/^\/+/, "");

      // បើមានឈ្មោះ bucket នៅខាងមុខ ដកចេញ
      if (path.startsWith("package-images/")) {
        path = path.substring("package-images/".length);
      }

      // បើ image_url មាន URL storage path
      // តែខ្វះផ្នែក package-images
      const storagePrefix =
        "storage/v1/object/public/";

      if (path.startsWith(storagePrefix)) {
        const publicPrefix =
          SUPABASE_URL + "/" + storagePrefix;

        return publicPrefix + path.substring(storagePrefix.length);
      }

      // បង្កើត Public URL ពី storage path
      const encodedPath = path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

      return (
        SUPABASE_URL +
        "/storage/v1/object/public/package-images/" +
        encodedPath
      );
    }

    // =====================================
    // LOAD PRODUCTS
    // =====================================

    async function loadProducts() {
      if (isLoading) return;

      isLoading = true;
      refreshButton.disabled = true;
      refreshButton.textContent = "កំពុងទាញយក...";
      status.textContent = "កំពុងទាញយកកញ្ចប់...";

      try {
        const response = await fetch(PRODUCTS_URL, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Accept": "application/json"
          },
          cache: "no-store"
        });

        if (!response.ok) {
          const detail = await response.text();
          console.error(
            "Products API:",
            response.status,
            detail
          );
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("ទិន្នន័យ Products មិនត្រឹមត្រូវ។");
        }

        const newProducts = data
          .filter(item => {
            if (item.is_active === false) return false;
            if (item.is_sold === true) return false;

            if (
              item.price === null ||
              item.price === undefined ||
              String(item.price).trim() === ""
            ) {
              return false;
            }

            const price = Number(item.price);

            // មិនបង្ហាញកញ្ចប់ដែលគ្មានតម្លៃត្រឹមត្រូវ
            if (!Number.isFinite(price) || price <= 0) {
              return false;
            }

            return item.id !== null &&
                   item.id !== undefined;
          })
          .map(item => ({
            id: item.id,
            name: item.name || item.title || "",
            price: Number(item.price),
            image: item.image_url || item.image || ""
          }));

        // រក្សាលំដាប់តាមឈ្មោះកញ្ចប់
        // ឧទាហរណ៍ Package 1, Package 2, Package 3
        newProducts.sort((a, b) => {
          return a.name.localeCompare(
            b.name,
            undefined,
            {
              numeric: true,
              sensitivity: "base"
            }
          );
        });

        const previousSelection = selectedProductId;
        products = newProducts;

        // រក្សាកញ្ចប់ដែលបានជ្រើសរើស
        if (
          !products.some(product =>
            String(product.id) === String(previousSelection)
          )
        ) {
          selectedProductId =
            products.length ? products[0].id : null;
        }

        renderProducts();
        status.textContent = "";

      } catch (error) {
        console.error("Load products failed:", error);

        status.textContent =
          "មិនអាចទាញយកកញ្ចប់បានទេ។ សូមពិនិត្យអ៊ីនធឺណិត រួចចុចផ្ទុកឡើងវិញ។";

      } finally {
        isLoading = false;
        refreshButton.disabled = false;
        refreshButton.textContent = "ផ្ទុកកញ្ចប់ឡើងវិញ";
      }
    }

    // =====================================
    // RENDER PRODUCTS
    // =====================================

    function renderProducts() {
      grid.replaceChildren();

      if (products.length === 0) {
        status.textContent =
          "មិនទាន់មានកញ្ចប់ដែលបានកំណត់តម្លៃទេ។";
        return;
      }

      products.forEach(product => {
        const card = document.createElement("button");

        card.type = "button";
        card.className = "product-card";
        card.setAttribute(
          "aria-pressed",
          String(
            String(product.id) === String(selectedProductId)
          )
        );

        if (
          String(product.id) === String(selectedProductId)
        ) {
          card.classList.add("selected");
        }

        // រូបភាព ឬកន្លែងបង្ហាញរូបភាព
        const placeholder = document.createElement("div");
        placeholder.className = "image-placeholder";
        placeholder.textContent = product.image
          ? "កំពុងទាញរូបភាព..."
          : "មិនទាន់មានរូបភាព";

        card.appendChild(placeholder);

        // ឈ្មោះកញ្ចប់
        const name = document.createElement("div");
        name.className = "product-name";
        name.textContent = product.name || "Top-up Package";
        card.appendChild(name);

        // តម្លៃកញ្ចប់
        const price = document.createElement("div");
        price.className = "product-price";
        price.textContent = "$" + product.price.toFixed(2);
        card.appendChild(price);

        // ជ្រើសរើសកញ្ចប់
        card.addEventListener("click", () => {
          selectedProductId = product.id;

          document.querySelectorAll(".product-card")
            .forEach(element => {
              element.classList.remove("selected");
              element.setAttribute("aria-pressed", "false");
            });

          card.classList.add("selected");
          card.setAttribute("aria-pressed", "true");
        });

        grid.appendChild(card);

        // ទាញរូបភាពដោយប្រើ Public URL
        if (product.image) {
          const imageUrl = getImageUrl(product.image);

          const img = document.createElement("img");
          img.alt = product.name || "រូបភាពកញ្ចប់";
          img.loading = "lazy";
          img.decoding = "async";
          img.src = imageUrl;

          img.onload = () => {
            console.log("Image loaded:", product.name);
          };

          img.onerror = () => {
            if (!card.isConnected) return;

            img.replaceWith(placeholder);
            placeholder.textContent =
              "មិនអាចបង្ហាញរូបភាពបាន";
          };

          placeholder.replaceWith(img);
        }
      });
    }

    // =====================================
    // EVENTS
    // =====================================

    refreshButton.addEventListener("click", loadProducts);

    // ផ្ទុកកញ្ចប់ពេលបើកវេបសាយ
    loadProducts();

    // ផ្ទុកឡើងវិញរៀងរាល់ 5 នាទី
    setInterval(loadProducts, 5 * 60 * 1000);
  </script>
</body>
</html>
